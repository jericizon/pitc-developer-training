<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockroom</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">Stockroom</div>
  </header>

  <main>
    <header class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p>Monitor stock levels and manage your product catalog.</p>
      </div>
      <button id="add-btn" class="btn btn-primary" type="button">Add Product</button>
    </header>

    <section class="stats" aria-label="Inventory summary">
      <article class="card"><span class="card-label">Total Products</span><strong id="stat-products">–</strong></article>
      <article class="card"><span class="card-label">Total Inventory Units</span><strong id="stat-units">–</strong></article>
      <article class="card"><span class="card-label">Low Stock Products</span><strong id="stat-low">–</strong></article>
      <article class="card"><span class="card-label">Out of Stock Products</span><strong id="stat-out">–</strong></article>
    </section>

    <section id="products" class="panel">
      <div class="filters">
        <input type="search" id="search" placeholder="Search by name or SKU" aria-label="Search products">
        <select id="category-filter" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
        <select id="status-filter" aria-label="Filter by stock status">
          <option value="">All statuses</option>
          <option value="in-stock">In Stock</option>
          <option value="low-stock">Low Stock</option>
          <option value="out-of-stock">Out of Stock</option>
        </select>
        <label class="check"><input type="checkbox" id="favorites-only"> Favorites only</label>
        <button type="button" id="clear-filters" class="btn">Clear filters</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>SKU</th>
              <th>Category</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Stock Status</th>
              <th>Favorite</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="product-dialog" aria-labelledby="dialog-title">
    <form id="product-form" novalidate>
      <h2 id="dialog-title">Add Product</h2>
      <label>Product Name <span class="req">*</span>
        <input name="name" type="text" required>
      </label>
      <label>SKU <span class="req">*</span>
        <input name="sku" type="text" required pattern="[A-Za-z0-9\-]{3,20}" title="3 to 20 letters, numbers, or hyphens" placeholder="ACC-001">
      </label>
      <label>Category <span class="req">*</span>
        <input name="category" type="text" required list="category-options">
      </label>
      <datalist id="category-options"></datalist>
      <div class="form-row">
        <label>Price <span class="req">*</span>
          <input name="price" type="number" required min="0" step="0.01">
        </label>
        <label>Quantity <span class="req">*</span>
          <input name="quantity" type="number" required min="0" step="1">
        </label>
      </div>
      <p class="hint"><span class="req">*</span> Required</p>
      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
